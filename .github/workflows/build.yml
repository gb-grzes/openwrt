name: Build OpenWrt - Xunison D50 5G

on:
  workflow_dispatch:
  push:
    paths:
      - '.config'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget

      - name: Configure git credentials
        run: |
          git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Add custom feeds
        run: |
          echo "src-git sms_tool https://github.com/4IceG/luci-app-sms-tool-js.git" >> feeds.conf.default
          echo "src-git modeminfo https://github.com/4IceG/luci-app-modeminfo.git" >> feeds.conf.default
          echo "src-git atinout https://github.com/4IceG/luci-app-atinout-mod.git" >> feeds.conf.default
          echo "src-git exigo_hub https://github.com/4IceG/luci-app-exigo-hub-d50-5g.git" >> feeds.conf.default
          echo "src-git nss_packages https://github.com/qosmio/nss-packages.git;NSS-12.5-K6.x-wwan" >> feeds.conf.default
          echo "src-git sqm_scripts_nss https://github.com/qosmio/sqm-scripts-nss.git" >> feeds.conf.default

      - name: Update feeds
        run: ./scripts/feeds update -a 2>&1

      - name: Install standard feeds
        run: |
          echo "=== Installing packages feed ==="
          ./scripts/feeds install -p packages -a 2>&1 || true
          echo "=== Installing luci feed ==="
          ./scripts/feeds install -p luci -a 2>&1 || true
          echo "=== Installing routing feed ==="
          ./scripts/feeds install -p routing -a 2>&1 || true

      - name: Install 4IceG feeds
        run: |
          echo "=== Installing sms_tool ==="
          ./scripts/feeds install -p sms_tool -a 2>&1
          echo "=== Installing modeminfo ==="
          ./scripts/feeds install -p modeminfo -a 2>&1
          echo "=== Installing atinout ==="
          ./scripts/feeds install -p atinout -a 2>&1
          echo "=== Installing exigo_hub ==="
          ./scripts/feeds install -p exigo_hub -a 2>&1

      - name: Install NSS feeds
        run: |
          echo "=== Installing nss_packages ==="
          ./scripts/feeds install -p nss_packages -a 2>&1
          echo "=== Installing sqm_scripts_nss ==="
          ./scripts/feeds install -p sqm_scripts_nss -a 2>&1

      - name: Apply custom config
        run: make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc) V=s 2>&1 | tee build.log | grep -E "^make|ERROR|error:" || true

      - name: Check for errors
        run: |
          if grep -q "^make.*Error" build.log; then
            echo "Build failed - last 50 lines:"
            tail -50 build.log
            exit 1
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-d50-5g-${{ github.sha }}
          path: |
            bin/targets/qualcommax/ipq50xx/*.bin
            bin/targets/qualcommax/ipq50xx/*.ubi
            bin/targets/qualcommax/ipq50xx/sha256sums
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7
